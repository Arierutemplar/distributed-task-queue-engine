global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ['/etc/prometheus/operational-rules.yml']
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: task-queue-api
    static_configs:
      - targets: ['app:3000']
  - job_name: task-queue-worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 3000
  - job_name: task-queue-backup
    static_configs:
      - targets: ['backup:3100']
