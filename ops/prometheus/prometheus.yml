global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: distributed-task-queue
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
        labels:
          role: all
  - job_name: distributed-task-queue-workers
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 3000
