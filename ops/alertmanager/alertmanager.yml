# Base routing for the repository's platform/security on-call labels.
# Replace placeholder receivers with your approved PagerDuty, Opsgenie, email or
# webhook integration. Keep team, owner and severity labels on every alert.
global:
  resolve_timeout: 5m

route:
  receiver: platform-oncall
  group_by: ['alertname', 'team', 'owner', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: security-oncall
      matchers:
        - team="security"
      continue: false
    - receiver: platform-oncall
      matchers:
        - team="platform"
      continue: false
    - receiver: default-oncall

receivers:
  - name: platform-oncall
  - name: security-oncall
  - name: default-oncall

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['service', 'team']
