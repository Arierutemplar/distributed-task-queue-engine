openapi: 3.0.3
info:
  title: Distributed Task Queue Engine
  version: 1.0.0
  description: |
    Task and admin routes are available in API and all roles. Metrics can be disabled.
    ADMIN_AUTH_MODE defaults to basic; oidc enables Keycloak Bearer JWTs or encrypted
    HttpOnly sessions via Authorization Code + PKCE. OIDC_ISSUER_URL is the internal
    JWKS/token base; OIDC_PUBLIC_ISSUER_URL is the issuer in tokens and browser URLs
    (defaults to OIDC_ISSUER_URL). OIDC_CLIENT_ID is the required JWT audience;
    OIDC_CLIENT_SECRET is optional for public PKCE clients. OIDC_REDIRECT_URI and
    SESSION_SECRET (32+ characters) are required in oidc mode.
    Non-local URLs require HTTPS; the local Compose demo permits HTTP even in the
    production Node image. Production deployments must use HTTPS. Cookies are Secure with HTTPS and
    SameSite=Lax; cookie-authenticated writes require a matching Origin.
    Realm roles or resource_access.<OIDC_CLIENT_ID>.roles grant admin full access
    or viewer read-only access. Writes denied with 403 are audited with subject/role.
    Administrative mutations first emit a pending audit intent with operationId,
    followed by a correlated result. A configured Redis audit failure blocks the
    mutation if intent persistence fails; logs-only mode has no persistent intent.
    A crash can leave pending unresolved. Redis, mutation and WORM delivery are not
    atomic; Redis replication/trimming and failed archival can create gaps.
    Administrative audit uses Redis and structured logs. AUDIT_WORM_ENABLED
    defaults to false; enabling it with complete AUDIT_WORM_ACCESS_KEY_ID and
    AUDIT_WORM_SECRET_ACCESS_KEY adds best-effort S3 Object Lock export, one JSON
    object per event. AUDIT_WORM_ENDPOINT is optional for AWS regional S3 or points
    to local MinIO; AUDIT_WORM_REGION defaults to us-east-1,
    AUDIT_WORM_BUCKET to audit-worm, AUDIT_WORM_FORCE_PATH_STYLE to true,
    AUDIT_WORM_LOCK_MODE to GOVERNANCE (COMPLIANCE is also supported),
    AUDIT_WORM_RETENTION_DAYS to 30 and AUDIT_WORM_TIMEOUT_MS to 5000.
    Incomplete credentials disable archival with a warning. Archive failures are
    logged without credentials and do not change API responses. The audit read
    API still reads Redis, not S3; no new storage API or security scheme is added.
    AUDIT_WORM_DELIVERY defaults to direct; opt-in outbox persists sanitized events
    in Redis and retries Object Lock delivery, including exhausted jobs after restart.
    Outbox requires WORM enabled and complete credentials. Recovery starts only
    after successful enqueue; admin mutation and audit enqueue are not atomic.
    DLQ_RECONCILE_ENABLED defaults to false; enabling it retains terminal originals
    for bounded, generation-aware repair of missed failure callbacks.
    PRODUCTION_HARDENING_ENABLED defaults to false; the production overlay requires
    HTTPS OIDC/archive, explicit CORS/proxy, durable audit and DLQ reconciliation.
    Optional off-host encrypted backups and load/failure/restore drills expose no
    new business API. See ops/OPERATIONS.md for retention, RPO/RTO/SLO objectives,
    measured technical restore scope and rollout/rollback.
    In non-production environments without API_KEYS, task requests use the public tenant.
    QUEUE_MAX_WAITING and TENANT_MAX_INFLIGHT default to 0 (disabled). Admission limits
    are coordinated in Redis. API_KEYS may be reloaded from Vault/OpenBao or API_KEYS_FILE.
    X-Request-Id is echoed on every response; invalid values are replaced.
paths:
  /health/live:
    get:
      summary: Liveness
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds]
                properties:
                  status: { type: string, enum: [ok] }
                  uptimeSeconds: { type: integer, minimum: 0 }
  /health/ready:
    get:
      summary: Readiness of configured dependencies
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Readiness'
        '503':
          $ref: '#/components/responses/Readiness'
  /metrics:
    get:
      summary: Prometheus exposition, when enabled
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/tasks/process:
    post:
      summary: Enqueue a task
      description: |
        Reusing a key with the same payload and tenant returns the original acceptance while the
        job is retained; a different payload returns 409 in that window. Invoice effects use a
        separate retained Redis record and stable provider key across worker retries and DLQ replay.
        A later conflicting invoice may be accepted after job removal and then fail in the worker.
        The local payment provider is simulated and shares Redis with the queue. Real providers
        must durably deduplicate the same key; Redis cannot atomically commit an external effect.
      security:
        - ApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Idempotency-Key
          in: header
          schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPayload'
      responses:
        '202':
          description: |
            Accepted by the current Redis primary or idempotently replayed, not proof of execution,
            external effect, fsync or replica acknowledgement. Asynchronous replication or a primary
            crash can lose an acknowledged task or effect record. Reuse the same tenant and
            Idempotency-Key on uncertain retries; no zero-loss or exactly-once guarantee is implied.
          headers:
            Location:
              schema: { type: string }
            Idempotent-Replayed:
              description: Present and true when replayed
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429':
          description: Rate limit or queue/tenant capacity exceeded
          headers:
            Retry-After:
              description: Delay in seconds before retrying capacity rejections
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}:
    get:
      summary: Read a task owned by the authenticated tenant
      security:
        - ApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /admin/queues:
    get:
      summary: Bull Board UI
      description: Bull Board also serves its own assets and API under this path; the dead-letter queue is read-only in the UI.
      security:
        - BasicAuth: []
        - OidcBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Bull Board HTML
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '302': { description: OIDC browser login redirect when no credentials are present }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/api/dead-letter:
    get:
      summary: List dead-letter entries
      security:
        - BasicAuth: []
        - OidcBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Page of waiting dead-letter entries
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, items]
                properties:
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeadLetter' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/api/dead-letter/{taskId}/replay:
    post:
      summary: Replay with a new task ID and the original tenant (admin role required)
      security:
        - BasicAuth: []
        - OidcBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: Replay accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Accepted'
                  - type: object
                    required: [replayOf]
                    properties:
                      replayOf: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/api/dead-letter/{taskId}:
    delete:
      summary: Delete a dead-letter entry (admin role required)
      security:
        - BasicAuth: []
        - OidcBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204': { description: Entry deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/api/secrets/reload:
    post:
      summary: Reload credentials on this API process
      description: Admin only; reloads API keys, admin, OIDC and active WORM credentials on this replica. Redis credentials remain unchanged and require a controlled restart when reported. Backup runs in a separate process and refreshes independently. Records an audit event and preserves previous credentials on validation failure.
      security:
        - BasicAuth: []
        - OidcBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Reload result without secret values
          content:
            application/json:
              schema:
                type: object
                required: [status, applied, restartRequired, restartRequiredKeys]
                properties:
                  status: { type: string, enum: [reloaded] }
                  applied:
                    type: array
                    items: { type: string }
                  restartRequired: { type: boolean }
                  restartRequiredKeys:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/api/audit:
    get:
      summary: Read recent admin audit records
      description: Reads the capped Redis trail. Optional WORM copies are independent versioned S3 objects, not returned by this endpoint.
      security:
        - BasicAuth: []
        - OidcBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Audit records, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/login:
    get:
      summary: Start Keycloak Authorization Code login with PKCE (OIDC mode only)
      security: []
      responses:
        '302':
          { description: Sets an encrypted ten-minute transaction cookie and redirects to Keycloak }
        '429': { $ref: '#/components/responses/Error' }
  /admin/callback:
    get:
      summary: Verify state, code, PKCE and nonce; set an encrypted HttpOnly session (OIDC only)
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Session created; redirect to /admin/queues }
        '401': { $ref: '#/components/responses/UnauthorizedAdmin' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /admin/logout:
    get:
      summary: Clear local session and redirect to Keycloak logout (OIDC only)
      security: []
      responses:
        '302': { description: Cookies cleared; Keycloak may ask to confirm SSO logout }
        '429': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ApiKey: { type: apiKey, in: header, name: X-API-Key }
    BasicAuth: { type: http, scheme: basic }
    OidcBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    AdminSession:
      type: apiKey
      in: cookie
      name: __Secure-admin_session
      description: Encrypted HttpOnly cookie; local HTTP development uses admin_session instead.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnauthorizedAdmin:
      description: Basic credentials or a valid OIDC token/session required (depending on ADMIN_AUTH_MODE)
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Readiness:
      description: Dependency check results
      content:
        application/json:
          schema:
            type: object
            required: [status, checks]
            properties:
              status: { type: string, enum: [ready, not_ready] }
              checks:
                type: object
                additionalProperties:
                  type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [up, down] }
                    error: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    TaskPayload:
      oneOf:
        - $ref: '#/components/schemas/ProcessDocument'
        - $ref: '#/components/schemas/SendNotification'
        - $ref: '#/components/schemas/ProcessInvoice'
      discriminator:
        propertyName: type
        mapping:
          PROCESS_DOCUMENT: '#/components/schemas/ProcessDocument'
          SEND_NOTIFICATION: '#/components/schemas/SendNotification'
          PROCESS_INVOICE: '#/components/schemas/ProcessInvoice'
    ProcessDocument:
      type: object
      required: [type, documentId, content]
      properties:
        type: { type: string, enum: [PROCESS_DOCUMENT] }
        schemaVersion: { type: integer, enum: [1], default: 1 }
        documentId: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
        content: { type: string, minLength: 1, maxLength: 1000000 }
    SendNotification:
      type: object
      required: [type, recipient, subject, message]
      properties:
        type: { type: string, enum: [SEND_NOTIFICATION] }
        schemaVersion: { type: integer, enum: [1], default: 1 }
        recipient: { type: string, format: email, maxLength: 320 }
        subject: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
        message: { type: string, minLength: 1, maxLength: 10000 }
    ProcessInvoice:
      type: object
      required: [type, customerId, amount, currency, taxId, items]
      properties:
        type: { type: string, enum: [PROCESS_INVOICE] }
        schemaVersion: { type: integer, enum: [1], default: 1 }
        customerId: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
        amount: { type: number, exclusiveMinimum: true, minimum: 0 }
        currency: { type: string, minLength: 1, maxLength: 10, pattern: '\S' }
        taxId: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
              quantity: { type: integer, minimum: 1 }
              unitPrice: { type: number, exclusiveMinimum: true, minimum: 0 }
    Accepted:
      type: object
      required: [taskId, taskType, status, acceptedAt]
      properties:
        taskId: { type: string }
        taskType: { $ref: '#/components/schemas/TaskType' }
        status: { type: string, enum: [accepted] }
        acceptedAt: { type: string, format: date-time }
    TaskType:
      type: string
      enum: [PROCESS_DOCUMENT, SEND_NOTIFICATION, PROCESS_INVOICE]
    TaskStatus:
      type: object
      required:
        [
          taskId,
          taskType,
          state,
          attemptsMade,
          maxAttempts,
          acceptedAt,
          processedAt,
          finishedAt,
          result,
          failedReason,
        ]
      properties:
        taskId: { type: string }
        taskType: { $ref: '#/components/schemas/TaskType' }
        state:
          {
            type: string,
            enum:
              [
                waiting,
                waiting-children,
                prioritized,
                active,
                delayed,
                completed,
                failed,
                dead-lettered,
                unknown,
              ],
          }
        attemptsMade: { type: integer }
        maxAttempts: { type: integer }
        acceptedAt: { type: string, format: date-time, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        failedReason: { type: string, nullable: true }
        result:
          nullable: true
          description: Discriminated by taskType; null before completion.
          oneOf:
            - $ref: '#/components/schemas/DocumentResult'
            - $ref: '#/components/schemas/NotificationResult'
            - $ref: '#/components/schemas/InvoiceResult'
    DocumentResult:
      type: object
      required: [taskType, documentId, characterCount, wordCount, sha256, completedAt]
      properties:
        taskType: { type: string, enum: [PROCESS_DOCUMENT] }
        documentId: { type: string }
        characterCount: { type: integer, minimum: 0 }
        wordCount: { type: integer, minimum: 0 }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        completedAt: { type: string, format: date-time }
    NotificationResult:
      type: object
      required: [taskType, notificationId, status, processedAt]
      properties:
        taskType: { type: string, enum: [SEND_NOTIFICATION] }
        notificationId: { type: string }
        status: { type: string, enum: [processed] }
        processedAt: { type: string, format: date-time }
    InvoiceResult:
      type: object
      required: [taskType, invoiceId, status, pdfUrl, processedAt]
      properties:
        taskType: { type: string, enum: [PROCESS_INVOICE] }
        invoiceId: { type: string, format: uuid }
        status: { type: string, enum: [PAID] }
        pdfUrl: { type: string, format: uri }
        processedAt: { type: string, format: date-time }
    DeadLetter:
      type: object
      required: [taskId, taskType, failedReason, attemptsMade, failedAt, requestId, tenantId]
      properties:
        taskId: { type: string }
        taskType: { $ref: '#/components/schemas/TaskType' }
        failedReason: { type: string }
        attemptsMade: { type: integer }
        failedAt: { type: string, format: date-time }
        requestId: { type: string, nullable: true }
        tenantId: { type: string }
    AuditRecord:
      type: object
      required: [timestamp, action, outcome, actor, requestId, method, path]
      properties:
        subject: { type: string, nullable: true, description: OIDC sub or Basic username }
        role: { type: string, nullable: true, enum: [admin, viewer, null] }
        id: { type: string }
        timestamp: { type: string, format: date-time }
        action: { type: string }
        outcome: { type: string, enum: [pending, success, denied, not_found, invalid, error] }
        actor: { type: string, nullable: true }
        requestId: { type: string }
        method: { type: string }
        path: { type: string }
        ip: { type: string }
        statusCode: { type: integer }
        tenantId: { type: string }
        taskId: { type: string }
        newTaskId: { type: string }
        operationId: { type: string, format: uuid }
        reason: { type: string }
