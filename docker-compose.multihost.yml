# Single-engine failure-domain simulation; this is not physical multi-host HA.
name: ${DTQ_MH_PROJECT:-dtq-multihost}

x-app: &app
  image: ${DTQ_MH_IMAGE:-dtq-multihost:local}
  environment: &app-env
    NODE_ENV: production
    SERVICE_NAME: dtq-multihost
    PORT: '3000'
    REDIS_URL: ''
    REDIS_PASSWORD: ${DTQ_MH_REDIS_PASSWORD:?Set DTQ_MH_REDIS_PASSWORD}
    REDIS_SENTINEL_HOSTS: sentinel-a:26379,sentinel-b:26379,sentinel-witness:26379
    REDIS_SENTINEL_MASTER_NAME: task-queue
    API_KEYS: ${DTQ_MH_API_KEY:?Set DTQ_MH_API_KEY}
    BILLING_FAILURE_RATE: '0'
    RATE_LIMIT_MAX: '0'
    SECRETS_PROVIDER: env
    METRICS_ENABLED: 'true'
  networks: [backbone]
  init: true
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 10s

x-sentinel: &sentinel
  image: redis:7-alpine
  command: ['sh', '/ops/sentinel.sh']
  environment: &sentinel-env
    REDIS_PASSWORD: ${DTQ_MH_REDIS_PASSWORD:?Set DTQ_MH_REDIS_PASSWORD}
    REDIS_SENTINEL_MASTER_NAME: task-queue
    REDIS_HA_PRIMARY_IP: ${DTQ_MH_REDIS_A_IP:-172.31.251.10}
  depends_on:
    redis-a: { condition: service_healthy }

services:
  redis-a:
    image: redis:7-alpine
    labels: { dtq.failure-domain: host-a }
    environment:
      REDIS_PASSWORD: ${DTQ_MH_REDIS_PASSWORD:?Set DTQ_MH_REDIS_PASSWORD}
      REDIS_HA_NODE_IP: ${DTQ_MH_REDIS_A_IP:-172.31.251.10}
    command:
      - sh
      - -c
      - |
        exec redis-server - --appendonly yes --maxmemory-policy noeviction <<EOF
        requirepass $$REDIS_PASSWORD
        masterauth $$REDIS_PASSWORD
        replica-announce-ip $$REDIS_HA_NODE_IP
        replica-announce-port 6379
        EOF
    volumes: ['redis_a:/data']
    networks:
      backbone: { ipv4_address: '${DTQ_MH_REDIS_A_IP:-172.31.251.10}' }
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30

  redis-b:
    image: redis:7-alpine
    labels: { dtq.failure-domain: host-b }
    environment:
      REDIS_PASSWORD: ${DTQ_MH_REDIS_PASSWORD:?Set DTQ_MH_REDIS_PASSWORD}
      REDIS_HA_NODE_IP: ${DTQ_MH_REDIS_B_IP:-172.31.251.11}
      REDIS_HA_PRIMARY_IP: ${DTQ_MH_REDIS_A_IP:-172.31.251.10}
    command:
      - sh
      - -c
      - |
        exec redis-server - --appendonly yes --maxmemory-policy noeviction <<EOF
        replicaof $$REDIS_HA_PRIMARY_IP 6379
        replica-announce-ip $$REDIS_HA_NODE_IP
        replica-announce-port 6379
        masterauth $$REDIS_PASSWORD
        requirepass $$REDIS_PASSWORD
        EOF
    volumes: ['redis_b:/data']
    networks:
      backbone: { ipv4_address: '${DTQ_MH_REDIS_B_IP:-172.31.251.11}' }
    depends_on:
      redis-a: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30

  sentinel-a:
    <<: *sentinel
    labels: { dtq.failure-domain: host-a }
    environment:
      <<: *sentinel-env
      SENTINEL_ANNOUNCE_IP: ${DTQ_MH_SENTINEL_A_IP:-172.31.251.21}
    volumes: ['./ops/multihost/sentinel.sh:/ops/sentinel.sh:ro', 'sentinel_a:/data']
    networks:
      backbone: { ipv4_address: '${DTQ_MH_SENTINEL_A_IP:-172.31.251.21}' }

  sentinel-b:
    <<: *sentinel
    labels: { dtq.failure-domain: host-b }
    environment:
      <<: *sentinel-env
      SENTINEL_ANNOUNCE_IP: ${DTQ_MH_SENTINEL_B_IP:-172.31.251.22}
    volumes: ['./ops/multihost/sentinel.sh:/ops/sentinel.sh:ro', 'sentinel_b:/data']
    networks:
      backbone: { ipv4_address: '${DTQ_MH_SENTINEL_B_IP:-172.31.251.22}' }

  sentinel-witness:
    <<: *sentinel
    labels: { dtq.failure-domain: witness }
    environment:
      <<: *sentinel-env
      SENTINEL_ANNOUNCE_IP: ${DTQ_MH_SENTINEL_W_IP:-172.31.251.23}
    volumes: ['./ops/multihost/sentinel.sh:/ops/sentinel.sh:ro', 'sentinel_witness:/data']
    networks:
      backbone: { ipv4_address: '${DTQ_MH_SENTINEL_W_IP:-172.31.251.23}' }

  api-a:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    labels: { dtq.failure-domain: host-a }
    environment: { <<: *app-env, PROCESS_ROLE: api }
    depends_on: &api-deps
      sentinel-a: { condition: service_started }
      sentinel-b: { condition: service_started }
      sentinel-witness: { condition: service_started }
  api-b:
    <<: *app
    labels: { dtq.failure-domain: host-b }
    environment: { <<: *app-env, PROCESS_ROLE: api }
    depends_on: *api-deps
  worker-a:
    <<: *app
    labels: { dtq.failure-domain: host-a }
    environment: { <<: *app-env, PROCESS_ROLE: worker }
    depends_on: *api-deps
  worker-b:
    <<: *app
    labels: { dtq.failure-domain: host-b }
    environment: { <<: *app-env, PROCESS_ROLE: worker }
    depends_on: *api-deps

networks:
  backbone:
    ipam:
      config:
        - subnet: ${DTQ_MH_SUBNET:-172.31.251.0/24}

volumes:
  redis_a:
  redis_b:
  sentinel_a:
  sentinel_b:
  sentinel_witness:
